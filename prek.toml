[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [{ id = "gitleaks" }]

[[repos]]
repo = "local"
hooks = [
  { id = "biome", name = "biome", language = "system", entry = "pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true", pass_filenames = true },
]
